<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>야구장</title>
<style>
html,body{margin:0;height:100%;background:#0d1424;overflow:hidden}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
a{position:fixed;right:max(10px,env(safe-area-inset-right,0px));bottom:max(10px,env(safe-area-inset-bottom,0px));z-index:1;
  font:700 12px system-ui,sans-serif;color:#fff;background:rgba(13,20,36,.7);padding:6px 10px;border-radius:999px;text-decoration:none;opacity:.7}
a:hover,a:focus-visible{opacity:1}
</style></head><body>
<!-- 게임 서버는 사주 Render 서버(saju-sge2.onrender.com/g/baseball/) 안에서 돌고, 주소창은 이 github.io 주소로 유지한다 -->
<iframe id="g" src="https://saju-sge2.onrender.com/g/baseball/" title="야구장" allow="autoplay; fullscreen; gamepad"></iframe>
<a href="https://saju-sge2.onrender.com/g/baseball/" target="_blank" rel="noopener">새 창에서 열기</a>
<script>document.getElementById('g').addEventListener('load',e=>e.target.focus())</script>
</body></html>
